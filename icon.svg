<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lagerfeuer-Ukulele">
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"    stop-color="#15403A"/>
      <stop offset="0.5"  stop-color="#0C2422"/>
      <stop offset="1"    stop-color="#061412"/>
    </linearGradient>
    <radialGradient id="glut" cx="0.5" cy="0.44" r="0.46">
      <stop offset="0"    stop-color="#FF8B3D" stop-opacity="0.40"/>
      <stop offset="0.6"  stop-color="#E8551F" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#E8551F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flammeAussen" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#FFA83E"/>
      <stop offset="0.42" stop-color="#F2692B"/>
      <stop offset="1"    stop-color="#C4411A"/>
    </linearGradient>
    <linearGradient id="flammeInnen" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#FFF6DA"/>
      <stop offset="0.45" stop-color="#FFD375"/>
      <stop offset="1"    stop-color="#FF9F35"/>
    </linearGradient>
    <linearGradient id="saite" gradientUnits="userSpaceOnUse" x1="256" y1="280" x2="256" y2="416">
      <stop offset="0"    stop-color="#8FF0E7"/>
      <stop offset="1"    stop-color="#35A69F"/>
    </linearGradient>
  </defs>

  <!-- Grundflaeche randlos; das Betriebssystem rundet die Ecken selbst -->
  <rect width="512" height="512" fill="url(#grund)"/>
  <circle cx="256" cy="225" r="235" fill="url(#glut)"/>

  <!-- Griffbrett: zwei Buende, vier Saiten, Sattel.
       Liegt unter der Flamme, ragt aber deutlich darunter hervor. -->
  <g fill="#2E948D">
    <rect x="191" y="330" width="130" height="5" rx="2.5"/>
    <rect x="191" y="366" width="130" height="4" rx="2"/>
  </g>
  <g stroke="url(#saite)" stroke-width="8" stroke-linecap="round">
    <line x1="196" y1="292" x2="196" y2="398"/>
    <line x1="236" y1="286" x2="236" y2="398"/>
    <line x1="276" y1="286" x2="276" y2="398"/>
    <line x1="316" y1="292" x2="316" y2="398"/>
  </g>
  <rect x="176" y="398" width="160" height="16" rx="8" fill="url(#saite)"/>

  <!-- Die Flamme, aus der die Saiten hervorkommen -->
  <path fill="url(#flammeAussen)" d="M256 66
    C 292 130, 320 160, 333 202
    C 349 248, 334 292, 298 308
    C 281 316, 268 319, 256 319
    C 240 319, 223 313, 208 304
    C 173 284, 165 240, 181 202
    C 195 164, 222 130, 256 66 Z"/>
  <path fill="url(#flammeInnen)" d="M256 158
    C 277 198, 293 217, 295 247
    C 297 281, 280 300, 256 300
    C 232 300, 215 281, 217 247
    C 219 217, 235 198, 256 158 Z"/>
</svg>
